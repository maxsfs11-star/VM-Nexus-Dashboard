[package]
name = "vm-nexus-dashboard"
version = "0.1.0"
description = "Central administrativa da VM Nexus Digital"
authors = ["VM Nexus Digital"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vm_nexus_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3" }

